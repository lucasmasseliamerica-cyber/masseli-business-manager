name: NEXALVO C2 - isolated package
on:
  push:
    branches: [automation/nexalvo-qa-actions]
    paths: ['qa/stock-c2*', 'qa/Invoke-QaStockC2.ps1', '.github/workflows/nexalvo-c2-offline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Parse C2 PowerShell without invoking launchers
        shell: pwsh
        run: |
          foreach ($path in @('qa/Invoke-QaStockC2.ps1','qa/stock-c2-private.ps1','qa/stock-c2-seed-launcher.ps1','qa/stock-c2-seed-private.ps1','qa/stock-c2-console-lab.ps1')) {
            $tokens=$null; $parseErrors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path),[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count -ne 0) { throw "C2 PowerShell syntax rejected: $path" }
          }
      - run: npm ci
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.64.0 @electric-sql/pglite@0.3.15
      - run: npx --no-install playwright install --with-deps chromium
      - name: C2 offline checks (no TEST environment or secrets)
        run: node --test --test-concurrency=1 --test-reporter=tap qa/stock-c2.test.mjs qa/stock-c2-client.test.mjs qa/stock-c2-runner-regression.test.mjs qa/stock-c2-browser.test.mjs qa/stock-c2-review.test.mjs qa/stock-c2-provision-sql.test.mjs qa/stock-c2-seed-launcher.test.mjs
      - run: npm run build
