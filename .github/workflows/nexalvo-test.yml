name: NEXALVO TEST - QA
on:
  workflow_dispatch:
  push:
    branches: [automation/nexalvo-qa-actions]
    paths:
      - '.github/workflows/nexalvo-test.yml'
      - 'qa/**'
      - 'src/**'
      - 'App.jsx'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: nexalvo-test-qa
  cancel-in-progress: false
jobs:
  build-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Parse opt-in P0.05 persistent browser test without executing any writes
        run: node --check qa/p0-purchase-browser-persistent.TEST.mjs
      - name: Run static security checks and save report
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/security.test.mjs | tee qa-static-results.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-static-results.tap
      - name: Upload build and static QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-build-and-static-qa
          path: |
            dist/
            qa-static-results.tap
          retention-days: 14
  test-api-smoke:
    needs: build-and-security
    if: github.event_name != 'pull_request'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify TEST target and run isolated API checks
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/api-smoke.mjs qa/concurrency-readonly.test.mjs qa/anonymous-isolation.test.mjs qa/invalid-jwt.test.mjs | tee qa-api-results.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-api-results.tap
      - name: Upload API QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-api-qa-report
          path: qa-api-results.tap
          retention-days: 14

  authenticated-concurrency:
    needs: test-api-smoke
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Concurrent sale idempotency in isolated TEST tenant
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/concurrency-authenticated.test.mjs | tee qa-concurrency-results.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-concurrency-results.tap
      - name: Upload authenticated concurrency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-authenticated-concurrency
          path: qa-concurrency-results.tap
          retention-days: 14

  access-regression:
    needs: test-api-smoke
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_A_EMAIL: ${{ secrets.QA_TWO_TENANT_A_EMAIL }}
      QA_TWO_TENANT_A_PASSWORD: ${{ secrets.QA_TWO_TENANT_A_PASSWORD }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticated multi-tenant reads and rejection of invalid writes
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/access-regression.test.mjs qa/p0-isolation-matrix.test.mjs qa/p0-write-isolation.test.mjs qa/p0-validation-boundaries.test.mjs qa/p0-cash-register-http.test.mjs qa/p0-purchases-http-read.test.mjs | tee qa-access-regression.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-access-regression.tap
      - name: Archive tenant/access regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-access-regression
          path: qa-access-regression.tap
          retention-days: 14

  auth-lifecycle:
    needs: test-api-smoke
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_A_EMAIL: ${{ secrets.QA_TWO_TENANT_A_EMAIL }}
      QA_TWO_TENANT_A_PASSWORD: ${{ secrets.QA_TWO_TENANT_A_PASSWORD }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify TEST auth login refresh rotation logout and refresh revocation
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/auth-session-lifecycle.test.mjs | tee qa-auth-lifecycle.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-auth-lifecycle.tap
      - name: Archive TEST session QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-auth-lifecycle
          path: qa-auth-lifecycle.tap
          retention-days: 14

  replay-financial:
    needs: test-api-smoke
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TEST write replay, discount, tax and accounting idempotency
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/replay-financial.test.mjs | tee qa-replay-financial.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-replay-financial.tap
      - name: Archive TEST replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-replay-financial
          path: qa-replay-financial.tap
          retention-days: 14

  network-after-commit:
    needs: test-api-smoke
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_A_EMAIL: ${{ secrets.QA_TWO_TENANT_A_EMAIL }}
      QA_TWO_TENANT_A_PASSWORD: ${{ secrets.QA_TWO_TENANT_A_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Drop committed TEST sale and PO responses and reconcile
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/p0-network-after-commit.test.mjs | tee qa-network-after-commit.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-network-after-commit.tap
      - name: Archive network-loss QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-network-after-commit
          path: qa-network-after-commit.tap
          retention-days: 14

  browser-smoke:
    needs: test-api-smoke
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser for isolated TEST user-interface smoke
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Serve isolated TEST frontend and run desktop/mobile smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4179 --strictPort &
          node --test --test-reporter=tap qa/browser-smoke.test.mjs | tee qa-browser-smoke.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-browser-smoke.tap
      - name: Save QA browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-browser-smoke
          path: |
            qa-browser-smoke.tap
            qa-browser-artifacts/
          retention-days: 14

  performance-read:
    needs: test-api-smoke
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safe bounded TEST read performance baseline
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/performance-read-smoke.test.mjs | tee qa-performance-read.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-performance-read.tap
      - name: Archive API read latency metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-performance-read
          path: qa-performance-read.tap
          retention-days: 14

  two-tenant-concurrency:
    needs: test-api-smoke
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_A_EMAIL: ${{ secrets.QA_TWO_TENANT_A_EMAIL }}
      QA_TWO_TENANT_A_PASSWORD: ${{ secrets.QA_TWO_TENANT_A_PASSWORD }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Two independent authenticated companies and different sale values
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/concurrency-two-tenants.test.mjs | tee qa-two-tenants-results.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-two-tenants-results.tap
      - name: Archive two-tenant QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-two-tenant-concurrency
          path: qa-two-tenants-results.tap
          retention-days: 14
