name: NEXALVO TEST - QA
on:
  workflow_dispatch:
  push:
    branches: [automation/nexalvo-qa-actions]
    paths:
      - '.github/workflows/nexalvo-test.yml'
      - 'qa/**'
      - 'src/**'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: nexalvo-test-qa
  cancel-in-progress: false
jobs:
  build-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run static security checks and save report
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/security.test.mjs | tee qa-static-results.tap
      - name: Upload build and static QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-build-and-static-qa
          path: |
            dist/
            qa-static-results.tap
          retention-days: 14
  test-api-smoke:
    needs: build-and-security
    if: github.event_name != 'pull_request'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify TEST target and run isolated API checks
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/api-smoke.mjs qa/concurrency-readonly.test.mjs qa/anonymous-isolation.test.mjs | tee qa-api-results.tap
      - name: Upload API QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-api-qa-report
          path: qa-api-results.tap
          retention-days: 14
