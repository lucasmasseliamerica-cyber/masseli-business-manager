name: NEXALVO TEST - QA
on:
  workflow_dispatch:
  push:
    branches: [automation/nexalvo-qa-actions]
    paths:
      - '.github/workflows/nexalvo-test.yml'
      - 'qa/**'
      - 'src/**'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: nexalvo-test-qa
  cancel-in-progress: false
jobs:
  build-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run static security checks and save report
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/security.test.mjs | tee qa-static-results.tap
      - name: Upload build and static QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-build-and-static-qa
          path: |
            dist/
            qa-static-results.tap
          retention-days: 14
  test-api-smoke:
    needs: build-and-security
    if: github.event_name != 'pull_request'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify TEST target and run isolated API checks
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/api-smoke.mjs qa/concurrency-readonly.test.mjs qa/anonymous-isolation.test.mjs qa/invalid-jwt.test.mjs | tee qa-api-results.tap
      - name: Upload API QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-api-qa-report
          path: qa-api-results.tap
          retention-days: 14

  authenticated-concurrency:
    needs: test-api-smoke
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_CONCURRENCY_ENABLED: ${{ vars.QA_CONCURRENCY_ENABLED }}
      QA_CONCURRENCY_EMAIL: ${{ secrets.QA_CONCURRENCY_EMAIL }}
      QA_CONCURRENCY_PASSWORD: ${{ secrets.QA_CONCURRENCY_PASSWORD }}
      QA_CONCURRENCY_BUSINESS_ID: ${{ vars.QA_CONCURRENCY_BUSINESS_ID }}
      QA_CONCURRENCY_LOCATION_ID: ${{ vars.QA_CONCURRENCY_LOCATION_ID }}
      QA_CONCURRENCY_PRODUCT_ID: ${{ vars.QA_CONCURRENCY_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Concurrent sale idempotency in isolated TEST tenant
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/concurrency-authenticated.test.mjs | tee qa-concurrency-results.tap
      - name: Upload authenticated concurrency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-authenticated-concurrency
          path: qa-concurrency-results.tap
          retention-days: 14

  two-tenant-concurrency:
    needs: test-api-smoke
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_A_EMAIL: ${{ secrets.QA_TWO_TENANT_A_EMAIL }}
      QA_TWO_TENANT_A_PASSWORD: ${{ secrets.QA_TWO_TENANT_A_PASSWORD }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
      QA_TWO_TENANT_A_BUSINESS_ID: ${{ vars.QA_TWO_TENANT_A_BUSINESS_ID }}
      QA_TWO_TENANT_A_LOCATION_ID: ${{ vars.QA_TWO_TENANT_A_LOCATION_ID }}
      QA_TWO_TENANT_A_PRODUCT_ID: ${{ vars.QA_TWO_TENANT_A_PRODUCT_ID }}
      QA_TWO_TENANT_B_BUSINESS_ID: ${{ vars.QA_TWO_TENANT_B_BUSINESS_ID }}
      QA_TWO_TENANT_B_LOCATION_ID: ${{ vars.QA_TWO_TENANT_B_LOCATION_ID }}
      QA_TWO_TENANT_B_PRODUCT_ID: ${{ vars.QA_TWO_TENANT_B_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Two independent authenticated companies and different sale values
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/concurrency-two-tenants.test.mjs | tee qa-two-tenants-results.tap
      - name: Archive two-tenant QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-two-tenant-concurrency
          path: qa-two-tenants-results.tap
          retention-days: 14
