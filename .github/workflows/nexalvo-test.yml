name: NEXALVO TEST - QA
on:
  workflow_dispatch:
  push:
    branches: [automation/nexalvo-qa-actions]
    paths:
      - '.github/workflows/nexalvo-test.yml'
      - 'qa/**'
      - 'src/**'
      - 'App.jsx'
      - 'vite.config.js'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: nexalvo-test-qa
  cancel-in-progress: false
jobs:
  build-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require zero runtime dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - name: Track the known Tailwind 3 build-only advisories
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-full.json
          audit_exit=$?
          set -e
          if [[ "$audit_exit" -gt 1 ]]; then
            echo "npm audit infrastructure failure (exit $audit_exit)"
            exit "$audit_exit"
          fi
          node qa/npm-audit-policy.mjs npm-audit-full.json
      - name: Parse opt-in P0.05 persistent browser test without executing any writes
        run: node --check qa/p0-purchase-browser-persistent.TEST.mjs
      - name: Run static security checks and save report
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/security.test.mjs qa/auth-core-regression.test.mjs qa/password-recovery-regression.test.mjs qa/purchase-compensation-regression.test.mjs qa/preflight-guards.test.mjs qa/role-preflight-guards.test.mjs qa/real-role-account-plan.test.mjs qa/reports-financial-permission.test.mjs qa/report-accuracy-regression.test.mjs qa/pos-usability-regression.test.mjs qa/product-catalog-regression.test.mjs qa/inventory-usability-regression.test.mjs qa/inventory-catalog-regression.test.mjs qa/purchase-supplier-usability-regression.test.mjs qa/customer-usability-regression.test.mjs qa/employee-workflow-regression.test.mjs qa/ui-responsive-regression.test.mjs qa/sales-receipt-regression.test.mjs qa/cash-register-validation-regression.test.mjs qa/platform-admin-foundation.test.mjs qa/settings-usability-regression.test.mjs qa/browser-smoke-isolation-regression.test.mjs qa/expense-cash-sql-regression.test.mjs qa/expense-idempotency-regression.test.mjs qa/employee-b-fixture-plan.test.mjs qa/security-catalog-export.test.mjs qa/npm-audit-policy.test.mjs | tee qa-static-results.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-static-results.tap
      - name: Upload build and static QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-build-and-static-qa
          path: |
            dist/
            qa-static-results.tap
            npm-audit-full.json
          retention-days: 14
  test-api-smoke:
    needs: build-and-security
    if: github.event_name != 'pull_request'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify TEST target and run isolated API checks
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/api-smoke.mjs qa/concurrency-readonly.test.mjs qa/anonymous-isolation.test.mjs qa/invalid-jwt.test.mjs | tee qa-api-results.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-api-results.tap
      - name: Upload API QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-api-qa-report
          path: qa-api-results.tap
          retention-days: 14

  authenticated-preflight:
    needs: test-api-smoke
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_A_EMAIL: ${{ secrets.QA_TWO_TENANT_A_EMAIL }}
      QA_TWO_TENANT_A_PASSWORD: ${{ secrets.QA_TWO_TENANT_A_PASSWORD }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only QA A/B identity, grants, tenant and fixture preflight
        id: preflight
        shell: bash
        run: |
          set +e
          node qa/p0-preflight-readonly.TEST.mjs 2>&1 | tee qa-preflight-readonly.log
          code=${PIPESTATUS[0]}
          set -e
          classification="$(sed -n 's/^PREFLIGHT \(PASS\|FAIL\|BLOCKED\) \[\([A-Z0-9_][A-Z0-9_]*\)\].*/\1/p' qa-preflight-readonly.log | tail -n 1)"
          reason_code="$(sed -n 's/^PREFLIGHT \(PASS\|FAIL\|BLOCKED\) \[\([A-Z0-9_][A-Z0-9_]*\)\].*/\2/p' qa-preflight-readonly.log | tail -n 1)"
          if [[ ! "$classification" =~ ^(PASS|FAIL|BLOCKED)$ || ! "$reason_code" =~ ^[A-Z0-9_]+$ ]]; then
            classification=BLOCKED
            reason_code=RUNNER_RESULT_UNAVAILABLE
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          echo "reason_code=$reason_code" >> "$GITHUB_OUTPUT"
      - name: Archive sanitized authenticated preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-authenticated-preflight
          path: qa-preflight-readonly.log
          retention-days: 14
      - name: Enforce authenticated preflight classification
        if: always()
        shell: bash
        env:
          PREFLIGHT_EXIT_CODE: ${{ steps.preflight.outputs.exit_code }}
          PREFLIGHT_CLASSIFICATION: ${{ steps.preflight.outputs.classification }}
          PREFLIGHT_REASON_CODE: ${{ steps.preflight.outputs.reason_code }}
        run: |
          case "$PREFLIGHT_EXIT_CODE:$PREFLIGHT_CLASSIFICATION" in
            0:PASS)
              echo "### Authenticated preflight: PASS [$PREFLIGHT_REASON_CODE]" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=NEXALVO authenticated preflight::PASS [$PREFLIGHT_REASON_CODE] - read-only QA A/B checks completed"
              ;;
            1:FAIL)
              echo "### Authenticated preflight: FAIL [$PREFLIGHT_REASON_CODE]" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=NEXALVO authenticated preflight::FAIL [$PREFLIGHT_REASON_CODE] - inspect the sanitized preflight artifact"
              exit 1
              ;;
            2:BLOCKED)
              echo "### Authenticated preflight: BLOCKED [$PREFLIGHT_REASON_CODE]" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=NEXALVO authenticated preflight::BLOCKED [$PREFLIGHT_REASON_CODE] - inspect the sanitized preflight artifact"
              exit 2
              ;;
            *)
              echo "### Authenticated preflight: BLOCKED [RUNNER_RESULT_UNAVAILABLE]" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=NEXALVO authenticated preflight::BLOCKED [RUNNER_RESULT_UNAVAILABLE]"
              exit 2
              ;;
          esac

  authenticated-concurrency:
    needs: authenticated-preflight
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Concurrent sale idempotency in isolated TEST tenant
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/concurrency-authenticated.test.mjs | tee qa-concurrency-results.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-concurrency-results.tap
      - name: Upload authenticated concurrency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-authenticated-concurrency
          path: qa-concurrency-results.tap
          retention-days: 14

  access-regression:
    needs: authenticated-preflight
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_A_EMAIL: ${{ secrets.QA_TWO_TENANT_A_EMAIL }}
      QA_TWO_TENANT_A_PASSWORD: ${{ secrets.QA_TWO_TENANT_A_PASSWORD }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticated multi-tenant reads and rejection of invalid writes
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/access-regression.test.mjs qa/p0-isolation-matrix.test.mjs qa/p0-write-isolation.test.mjs qa/p0-validation-boundaries.test.mjs qa/p0-cash-register-http.test.mjs qa/p0-purchases-http-read.test.mjs | tee qa-access-regression.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-access-regression.tap
      - name: Archive tenant/access regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-access-regression
          path: qa-access-regression.tap
          retention-days: 14

  auth-lifecycle:
    needs: authenticated-preflight
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_A_EMAIL: ${{ secrets.QA_TWO_TENANT_A_EMAIL }}
      QA_TWO_TENANT_A_PASSWORD: ${{ secrets.QA_TWO_TENANT_A_PASSWORD }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify TEST auth login refresh rotation logout and refresh revocation
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/auth-session-lifecycle.test.mjs | tee qa-auth-lifecycle.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-auth-lifecycle.tap
      - name: Archive TEST session QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-auth-lifecycle
          path: qa-auth-lifecycle.tap
          retention-days: 14

  replay-financial:
    needs: authenticated-preflight
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TEST write replay, discount, tax and accounting idempotency
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/replay-financial.test.mjs | tee qa-replay-financial.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-replay-financial.tap
      - name: Archive TEST replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-replay-financial
          path: qa-replay-financial.tap
          retention-days: 14

  network-after-commit:
    needs: authenticated-preflight
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_A_EMAIL: ${{ secrets.QA_TWO_TENANT_A_EMAIL }}
      QA_TWO_TENANT_A_PASSWORD: ${{ secrets.QA_TWO_TENANT_A_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Drop committed TEST sale and PO responses and reconcile
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/p0-network-after-commit.test.mjs | tee qa-network-after-commit.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-network-after-commit.tap
      - name: Archive network-loss QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-network-after-commit
          path: qa-network-after-commit.tap
          retention-days: 14

  browser-smoke:
    needs: authenticated-preflight
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser for isolated TEST user-interface smoke
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Serve isolated TEST frontend and run desktop/mobile smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4179 --strictPort &
          set +e
          node --test --test-reporter=tap qa/browser-smoke.test.mjs qa/password-recovery-browser.TEST.mjs | tee qa-browser-smoke.tap
          test_code=${PIPESTATUS[0]}
          set -e
          while IFS= read -r failed_test; do
            echo "::error title=NEXALVO browser-smoke TAP::${failed_test}"
          done < <(grep -E '^[[:space:]]*not ok ' qa-browser-smoke.tap || true)
          if grep -Eq '^# skipped [1-9][0-9]*' qa-browser-smoke.tap; then
            echo "::error title=NEXALVO browser-smoke TAP::One or more browser tests were skipped"
            exit 1
          fi
          exit "$test_code"
      - name: Save QA browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-browser-smoke
          path: |
            qa-browser-smoke.tap
            qa-browser-artifacts/
          retention-days: 14

  performance-read:
    needs: authenticated-preflight
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safe bounded TEST read performance baseline
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/performance-read-smoke.test.mjs | tee qa-performance-read.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-performance-read.tap
      - name: Archive API read latency metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-performance-read
          path: qa-performance-read.tap
          retention-days: 14

  two-tenant-concurrency:
    needs: authenticated-preflight
    if: github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    environment: nexalvo-test
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      QA_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_TWO_TENANT_ENABLED: ${{ vars.QA_TWO_TENANT_ENABLED }}
      QA_TWO_TENANT_A_EMAIL: ${{ secrets.QA_TWO_TENANT_A_EMAIL }}
      QA_TWO_TENANT_A_PASSWORD: ${{ secrets.QA_TWO_TENANT_A_PASSWORD }}
      QA_TWO_TENANT_B_EMAIL: ${{ secrets.QA_TWO_TENANT_B_EMAIL }}
      QA_TWO_TENANT_B_PASSWORD: ${{ secrets.QA_TWO_TENANT_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Two independent authenticated companies and different sale values
        shell: bash
        run: set -o pipefail; node --test --test-reporter=tap qa/concurrency-two-tenants.test.mjs | tee qa-two-tenants-results.tap; ! grep -Eq '^# skipped [1-9][0-9]*' qa-two-tenants-results.tap
      - name: Archive two-tenant QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexalvo-two-tenant-concurrency
          path: qa-two-tenants-results.tap
          retention-days: 14

  qa-summary:
    needs:
      - build-and-security
      - test-api-smoke
      - authenticated-preflight
      - authenticated-concurrency
      - access-regression
      - auth-lifecycle
      - replay-financial
      - network-after-commit
      - browser-smoke
      - performance-read
      - two-tenant-concurrency
    if: always() && github.ref == 'refs/heads/automation/nexalvo-qa-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download this run's QA artifacts
        uses: actions/download-artifact@v4
        with:
          path: qa-artifacts
      - name: Publish exact root TAP totals
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tap_files < <(find qa-artifacts -type f -name '*.tap' -print | sort)
          if (( ${#tap_files[@]} != 10 )); then
            echo "### QA TAP summary: INCOMPLETE (${#tap_files[@]}/10 reports)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=NEXALVO QA TAP summary::INCOMPLETE - expected 10 TAP reports, found ${#tap_files[@]}"
            exit 1
          fi
          total_tests=0
          total_pass=0
          total_fail=0
          total_skipped=0
          for file in "${tap_files[@]}"; do
            mapfile -t tests < <(sed -n 's/^# tests \([0-9][0-9]*\)$/\1/p' "$file")
            mapfile -t passes < <(sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' "$file")
            mapfile -t failures < <(sed -n 's/^# fail \([0-9][0-9]*\)$/\1/p' "$file")
            mapfile -t skipped < <(sed -n 's/^# skipped \([0-9][0-9]*\)$/\1/p' "$file")
            if (( ${#tests[@]} != 1 || ${#passes[@]} != 1 || ${#failures[@]} != 1 || ${#skipped[@]} != 1 )); then
              echo "::error title=NEXALVO QA TAP summary::Invalid root TAP summary in $(basename "$file")"
              exit 1
            fi
            total_tests=$((total_tests + tests[0]))
            total_pass=$((total_pass + passes[0]))
            total_fail=$((total_fail + failures[0]))
            total_skipped=$((total_skipped + skipped[0]))
          done
          echo "### QA TAP summary: $total_pass/$total_tests PASS; $total_fail FAIL; $total_skipped SKIPPED" >> "$GITHUB_STEP_SUMMARY"
          if (( total_tests != total_pass || total_fail != 0 || total_skipped != 0 )); then
            echo "::error title=NEXALVO QA TAP summary::$total_pass/$total_tests PASS; $total_fail FAIL; $total_skipped SKIPPED"
            exit 1
          fi
          echo "::notice title=NEXALVO QA TAP summary::$total_pass/$total_tests PASS; 0 FAIL; 0 SKIPPED"
